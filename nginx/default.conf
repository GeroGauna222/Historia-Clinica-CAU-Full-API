server {
    listen 80;
    listen [::]:80;
    server_name cau-hc.com.ar www.cau-hc.com.ar;

    location / {
        return 301 https://cau-hc.com.ar$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cau-hc.com.ar;

    ssl_certificate /etc/letsencrypt/live/cau-hc.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cau-hc.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    server_tokens off;

    location / {
        return 301 https://cau-hc.com.ar$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cau-hc.com.ar;

    ssl_certificate /etc/letsencrypt/live/cau-hc.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cau-hc.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    server_tokens off;

    # Upload/PDF size limit.
    client_max_body_size 20M;

    # Flask backend.
    location /api/ {
        proxy_pass http://web:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
